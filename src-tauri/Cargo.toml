[package]
name = "openalgo-desktop"
version = "1.0.0"
description = "OpenAlgo Desktop - Algorithmic Trading Platform"
authors = ["OpenAlgo"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "openalgo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
duckdb = { version = "1.0", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Security
keyring = "2.3"
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# HTTP server (for webhooks)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Binary parsing
byteorder = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Concurrency
parking_lot = "0.12"
dashmap = "6.0"

# Async trait
async-trait = "0.1"

# URL parsing
url = "2.5"
urlencoding = "2.1"

# UUID generation
uuid = { version = "1.8", features = ["v4"] }
statrs = "0.17"
# [wp-anchor] WP5 deps
# American option pricing (binomial lattice); the facade's `pricing` feature pulls
# only optionstratlib-core/-math/-pricing. Requires rustc 1.89 (edition 2024).
optionstratlib = { version = "0.24.3", default-features = false, features = ["pricing"] }
rust_decimal = "1"
#
# [wp-anchor] WP6 deps
ta-lib = "0.8"
#
# [wp-anchor] WP7 deps
csv = "1"
#
# [wp-anchor] WP8 deps
#

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The binomial lattice (WP5) does its arithmetic in rust_decimal; unoptimized it
# costs ~35 ms per 200-step tree (3× the optimized cost), which makes the Options
# page's binomial chain unusable under `tauri dev`. Keep only the pricing crates
# optimized in dev/test builds; the app crate stays debuggable.
[profile.dev.package.rust_decimal]
opt-level = 3

[profile.dev.package.positive]
opt-level = 3

[profile.dev.package.optionstratlib-core]
opt-level = 3

[profile.dev.package.optionstratlib-pricing]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Same four crates at full speed in release builds too: the app-wide "s" trades
# speed for size, and the lattice is the one hot loop that must not pay for it.
[profile.release.package.rust_decimal]
opt-level = 3

[profile.release.package.positive]
opt-level = 3

[profile.release.package.optionstratlib-core]
opt-level = 3

[profile.release.package.optionstratlib-pricing]
opt-level = 3
